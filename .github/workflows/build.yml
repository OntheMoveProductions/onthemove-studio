# Builds "On the Move Studio" for Mac (both chips) and Windows on GitHub's machines.
# - Push a tag like v1.0.1 to build everything and attach it to a Release.
# - Or run it by hand (Actions → Build app → Run workflow) to test a build.
name: Build app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        options: [all, mac-arm64, mac-x64, windows]
        default: windows

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Skip this chip
        id: skip
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.target }}" != "all" ] && [ "${{ inputs.target }}" != "mac-${{ matrix.arch }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.skip.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.skip.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install build tools
        if: steps.skip.outputs.skip != 'true'
        run: npm ci

      - name: Prepare the app folder (${{ matrix.arch }})
        if: steps.skip.outputs.skip != 'true'
        run: node scripts/build-app.mjs --arch ${{ matrix.arch }}

      - name: Check the bundled tools are for ${{ matrix.arch }}
        if: steps.skip.outputs.skip != 'true'
        run: |
          file build/app/node_modules/ffmpeg-static/ffmpeg
          file build/app/node_modules/ffmpeg-static/ffmpeg | grep -q "$( [ ${{ matrix.arch }} = arm64 ] && echo arm64 || echo x86_64 )"
          ls build/app/node_modules/@img/

      - name: Package
        if: steps.skip.outputs.skip != 'true'
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Check the signature
        if: steps.skip.outputs.skip != 'true'
        run: |
          APP="$(find release -maxdepth 2 -name 'On the Move Studio.app' | head -1)"
          echo "APP=$APP" >> "$GITHUB_ENV"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -5

      - name: Smoke test (server, dashboard, sharp, ffmpeg inside the app)
        if: steps.skip.outputs.skip != 'true'
        run: |
          BIN="$APP/Contents/MacOS/On the Move Studio"
          if [ "${{ matrix.arch }}" = x64 ]; then
            softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
            OTM_SMOKE_TEST=1 arch -x86_64 "$BIN"
          else
            OTM_SMOKE_TEST=1 "$BIN"
          fi

      - name: Update test (download, verify, swap in place, reopen)
        if: steps.skip.outputs.skip != 'true'
        run: |
          APPS="$RUNNER_TEMP/Apps"; TARGET="$APPS/On the Move Studio.app"
          mkdir -p "$APPS" feed
          ditto "$APP" "$TARGET"
          cp release/*-${{ matrix.arch }}.zip feed/update.zip
          printf '{"tag_name":"v99.0.0","html_url":"https://example.com","assets":[{"name":"test-%s.zip","browser_download_url":"http://127.0.0.1:8765/update.zip"}]}' "${{ matrix.arch }}" > feed/latest.json
          node -e "const fs=require('fs'),p=require('path');require('http').createServer((q,r)=>{const f=p.join('feed',p.basename(q.url));if(!fs.existsSync(f)){r.writeHead(404);return r.end()}r.writeHead(200,{'content-length':fs.statSync(f).size});fs.createReadStream(f).pipe(r)}).listen(8765,'127.0.0.1')" &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/latest.json >/dev/null 2>&1 && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8765/latest.json
          ls -la feed/
          BEFORE=$(stat -f %i "$TARGET")
          RUNAS=""; [ "${{ matrix.arch }}" = x64 ] && RUNAS="arch -x86_64"
          OTM_UPDATE_SELFTEST=1 OTM_UPDATE_FEED=http://127.0.0.1:8765/latest.json $RUNAS "$TARGET/Contents/MacOS/On the Move Studio"
          for i in $(seq 1 90); do
            NOW=$(stat -f %i "$TARGET" 2>/dev/null || echo none)
            [ "$NOW" != "$BEFORE" ] && [ "$NOW" != none ] && break
            sleep 1
          done
          [ "$NOW" != "$BEFORE" ] || { echo "FAIL app was not replaced"; exit 1; }
          # The old copy is deleted right after the swap; give that a moment.
          for i in $(seq 1 30); do [ -e "$TARGET.previous" ] || break; sleep 1; done
          [ ! -e "$TARGET.previous" ] || { echo "FAIL backup left behind"; exit 1; }
          # Right after the swap macOS may still be scanning the new app; retry briefly.
          for i in $(seq 1 10); do codesign --verify --deep --strict "$TARGET" && break; sleep 2; done
          codesign --verify --deep --strict "$TARGET"
          for i in $(seq 1 30); do pgrep -f "$TARGET/Contents/MacOS/On the Move Studio" >/dev/null && break; sleep 1; done
          pgrep -f "$TARGET/Contents/MacOS/On the Move Studio" >/dev/null || { echo "FAIL updated app did not reopen"; exit 1; }
          echo "PASS replaced in place, signature valid, reopened"
          pkill -f "$TARGET/Contents/MacOS/On the Move Studio" || true

      - uses: actions/upload-artifact@v4
        if: steps.skip.outputs.skip != 'true'
        with:
          name: On-the-Move-Studio-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install build tools
        run: npm ci

      - name: Prepare the app folder
        run: node scripts/build-app.mjs --platform win32 --arch x64

      - name: Package
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Smoke test (server, dashboard, sharp, ffmpeg inside the app)
        run: OTM_SMOKE_TEST=1 "release/win-unpacked/On the Move Studio.exe"

      - name: Update test (download, reinstall silently, reopen)
        run: |
          SETUP="$(ls release/On-the-Move-Studio-*-x64.exe)"
          time "$SETUP" //S
          D="$LOCALAPPDATA/Programs/onthemove-studio"; EXE="$D/On the Move Studio.exe"
          [ -e "$EXE" ] || { echo "FAIL installer did not install the app"; exit 1; }
          mkdir -p feed && cp "$SETUP" feed/setup.exe
          printf '{"tag_name":"v99.0.0","html_url":"https://example.com","assets":[{"name":"test-x64.exe","browser_download_url":"http://127.0.0.1:8765/setup.exe"}]}' > feed/latest.json
          node -e "const fs=require('fs'),p=require('path');require('http').createServer((q,r)=>{const f=p.join('feed',p.basename(q.url));if(!fs.existsSync(f)){r.writeHead(404);return r.end()}r.writeHead(200,{'content-length':fs.statSync(f).size});fs.createReadStream(f).pipe(r)}).listen(8765,'127.0.0.1')" &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/latest.json >/dev/null 2>&1 && break; sleep 0.5; done
          # The installer must put back a file removed from the installed app.
          rm "$D/LICENSE.electron.txt"
          OTM_UPDATE_LOG="$PWD/progress.log" OTM_UPDATE_SELFTEST=1 OTM_UPDATE_FEED=http://127.0.0.1:8765/latest.json "$EXE" > update.log 2>&1 &
          for i in $(seq 1 480); do
            [ -e "$D/LICENSE.electron.txt" ] && break
            if [ $((i % 15)) = 0 ]; then
              echo "--- ${i}s"; tail -2 update.log || true; tail -1 progress.log 2>/dev/null || true; tasklist | grep -iE "move|setup|ins" || true
              ls -la "$TEMP"/otm-update-* 2>/dev/null | head -5 || true
            fi
            sleep 1
          done
          echo "waited ${i}s"; cat update.log
          grep -q "^PASS" update.log || { echo "FAIL update did not start"; exit 1; }
          [ -e "$D/LICENSE.electron.txt" ] || { echo "FAIL app was not reinstalled"; exit 1; }
          for i in $(seq 1 60); do tasklist //FI "IMAGENAME eq On the Move Studio.exe" | grep -q "On the Move" && break; sleep 1; done
          tasklist //FI "IMAGENAME eq On the Move Studio.exe" | grep -q "On the Move" || { echo "FAIL updated app did not reopen"; exit 1; }
          echo "PASS reinstalled and reopened"
          taskkill //F //IM "On the Move Studio.exe" || true

      - uses: actions/upload-artifact@v4
        with:
          name: On-the-Move-Studio-windows
          path: release/On-the-Move-Studio-*-x64.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" files/*.dmg files/*.zip files/*.exe --repo "${{ github.repository }}" --title "On the Move Studio ${{ github.ref_name }}" \
            --notes "Mac with Apple Silicon (M1–M4): the arm64 .dmg. Intel Mac: the x64 .dmg. First install: System Settings → Privacy & Security → Open Anyway. Windows: the .exe (if SmartScreen warns: More info → Run anyway). After that the app updates itself."
